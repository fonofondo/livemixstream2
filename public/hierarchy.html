<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveMixStream — Open a Session</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <h1 class="brand-title">LiveMixStream</h1>
    </header>
    <main class="stream-card">
      <h2 class="session-title">Open a session</h2>
      <p style="color:var(--text-muted);margin:8px 0 16px;font-size:0.9rem">
        Listening and track ducking both live on the session page. Enter the code from the plugin (COPY LINK).
      </p>
      <form id="joinForm" style="display:flex;gap:8px;flex-wrap:wrap">
        <input id="sessionCode" class="text-input" maxlength="12" placeholder="e.g. 8TZWY4"
          style="flex:1;min-width:160px;background:rgba(10,14,23,0.7);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#fff;font-size:1rem">
        <button type="submit" class="play-btn" style="width:auto;height:48px;padding:0 20px;border-radius:12px;font-size:0.95rem">Open</button>
      </form>
    </main>
  </div>
  <script>
    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const code = document.getElementById('sessionCode').value.trim().toUpperCase();
      if (code) location.href = '/s/' + encodeURIComponent(code);
    });
  </script>
</body>
</html>
