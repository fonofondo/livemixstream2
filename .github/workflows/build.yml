name: LiveMixStream CI/CD Build Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-server:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  build-plugin:
    name: Build Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev \
            ladspa-sdk freeglut3-dev g++ libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libfreetype-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev libopus-dev pkg-config

      - name: macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja opus pkg-config || true
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix opus)/lib" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin Artifacts
        run: cmake --build build --config Release

      - name: Run Gain Ramp Test
        if: runner.os != 'Windows'
        run: |
          cmake --build build --target lms_gain_ramp_test --config Release
          ./build/lms_gain_ramp_test || ./build/Release/lms_gain_ramp_test

      - name: Upload Windows VST3 Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LiveMixStream-Windows-VST3
          path: build/LiveMixStream_artefacts/Release/VST3/LiveMixStream.vst3

      - name: Upload macOS VST3 & AU Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LiveMixStream-macOS-Plugins
          path: |
            build/LiveMixStream_artefacts/Release/VST3/LiveMixStream.vst3
            build/LiveMixStream_artefacts/Release/AU/LiveMixStream.component

      - name: Upload Linux VST3 Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LiveMixStream-Linux-VST3
          path: build/LiveMixStream_artefacts/Release/VST3/LiveMixStream.vst3

  build-asaphops-companion:
    name: Build AsaphOps Companion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libjack-jackd2-dev \
            ladspa-sdk freeglut3-dev g++ libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libfreetype-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libcurl4-openssl-dev pkg-config

      - name: macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja opus pkg-config || true
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix opus)/lib" >> "$GITHUB_ENV"

      - name: Configure AsaphOps CMake
        shell: bash
        run: |
          extra=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            extra+=(
              -G Ninja
              -DCMAKE_OSX_ARCHITECTURES=arm64\;x86_64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=-
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=
            )
          fi
          cmake -S asaphops -B asaphops/build -DCMAKE_BUILD_TYPE=Release "${extra[@]}"

      - name: Build Companion and Plugin
        run: cmake --build asaphops/build --config Release --target AsaphOpsCompanion AsaphOpsPlugin_VST3 ${{ runner.os == 'macOS' && 'AsaphOpsPlugin_AU' || '' }}

      - name: Package macOS VST3
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VST3="asaphops/build/AsaphOpsPlugin_artefacts/Release/VST3/AsaphOps.vst3"
          AU="asaphops/build/AsaphOpsPlugin_artefacts/Release/AU/AsaphOps.component"
          APP="asaphops/build/AsaphOpsCompanion_artefacts/Release/AsaphOps.app"
          test -d "$VST3"
          mkdir -p dist-mac
          codesign --force --deep --sign - --timestamp=none "$VST3"
          ditto -c -k --keepParent "$VST3" dist-mac/AsaphOps-macOS-VST3.zip
          if [[ -d "$AU" ]]; then
            codesign --force --deep --sign - --timestamp=none "$AU"
            ditto -c -k --keepParent "$AU" dist-mac/AsaphOps-macOS-AU.zip
          fi
          if [[ -d "$APP" ]]; then
            codesign --force --deep --sign - --timestamp=none "$APP"
            ditto -c -k --keepParent "$APP" dist-mac/AsaphOps-macOS-Companion.zip
          fi
          ls -la dist-mac

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AsaphOps-Windows
          path: |
            asaphops/build/AsaphOpsCompanion_artefacts/Release/AsaphOps.exe
            asaphops/build/AsaphOpsPlugin_artefacts/Release/VST3/AsaphOps.vst3
          if-no-files-found: error

      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AsaphOps-macOS
          path: dist-mac/*.zip
          if-no-files-found: error

      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AsaphOps-Linux
          path: |
            asaphops/build/AsaphOpsCompanion_artefacts/Release/AsaphOps
            asaphops/build/AsaphOpsPlugin_artefacts/Release/VST3/AsaphOps.vst3
          if-no-files-found: warn
