name: AsaphOps macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: asaphops-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  macos:
    name: Companion + plugin (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ninja, opus, pkg-config
        run: |
          brew install ninja opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix opus)/lib" >> "$GITHUB_ENV"

      - name: Configure CMake
        working-directory: asaphops
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DASAPHOPS_COPY_PLUGIN=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=- \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=

      - name: Build companion, VST3, AU
        working-directory: asaphops
        run: cmake --build build --target AsaphOpsCompanion AsaphOpsPlugin_VST3 AsaphOpsPlugin_AU

      - name: Ad-hoc sign and zip
        run: |
          set -euo pipefail
          find_bundle() {
            local name="$1"
            local found
            found="$(find asaphops/build -type d -name "$name" | head -n 1 || true)"
            if [[ -z "$found" || ! -d "$found" ]]; then
              echo "Missing bundle: $name"
              find asaphops/build -maxdepth 5 \( -name '*.app' -o -name '*.vst3' -o -name '*.component' \) -print || true
              exit 1
            fi
            echo "$found"
          }

          APP="$(find_bundle AsaphOps.app)"
          VST3="$(find_bundle AsaphOps.vst3)"
          AU="$(find_bundle AsaphOps.component)"

          adhoc() {
            codesign --force --deep --sign - --timestamp=none "$1"
            codesign --verify --verbose=2 "$1" || true
          }
          adhoc "$APP"
          adhoc "$VST3"
          adhoc "$AU"

          mkdir -p dist-mac
          ditto -c -k --keepParent "$APP" dist-mac/AsaphOps-macOS-Companion.zip
          ditto -c -k --keepParent "$VST3" dist-mac/AsaphOps-macOS-VST3.zip
          ditto -c -k --keepParent "$AU" dist-mac/AsaphOps-macOS-AU.zip

          cp asaphops/scripts/macos-ci-install.txt dist-mac/INSTALL.txt
          ls -lah dist-mac

      - name: Upload AsaphOps-macOS
        uses: actions/upload-artifact@v4
        with:
          name: AsaphOps-macOS
          path: dist-mac/*
          if-no-files-found: error
          retention-days: 30
